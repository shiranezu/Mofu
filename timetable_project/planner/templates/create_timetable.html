{% extends 'base.html' %}

{% block title %}Create Timetable - Sachi{% endblock %}

{% block content %}
    <h2>Create a New Timetable</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="name" placeholder="e.g., Semester 2">
        <button type="submit">Create</button>
    </form>
    <br>
    <a href="{% url 'planner:timetable_home' %}">Back</a>
{% endblock %}
