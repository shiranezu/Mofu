{% extends 'base.html' %}

{% block title %}Schedules - Sachi{% endblock %}

{% block content %}
    <h1>Schedules</h1>

    <a href="{% url 'planner:create_schedule' %}">+ Create New Schedule</a>

    <hr>

    <h2>Your Schedules</h2>
    <ul>
        {% for schedule in schedules %}
            <li>
                <a href="{% url 'planner:schedule_view' schedule.id %}">{{ schedule.name }}</a>
                | <a href="{% url 'planner:delete_schedule' schedule.id %}">Delete</a>
            </li>
        {% empty %}
            <li>No schedules yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
