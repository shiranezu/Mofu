{% extends 'base.html' %}

{% block title %}{{ title }} - Sachi{% endblock %}

{% block content %}
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="timetable" value="{{ timetable.id }}">
        {% if day %}
            <input type="hidden" name="day" value="{{ day }}">
        {% endif %}
        {% if timeslot_id %}
            <input type="hidden" name="timeslot" value="{{ timeslot_id }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <br>
    <a href="javascript:history.back()">← Back</a>
{% endblock %}
