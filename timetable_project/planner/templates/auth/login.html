<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <form method="POST">
        <h2>Login</h2>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        
        <br>
        {% csrf_token %}
        <input placeholder="username" name="username">
        <br>
        <input placeholder="password" type="password" name="password">
        <br>
        <button>Login</button>
        <p class="message">Not registered? <a href="{% url 'planner:register' %}">Create an account</a></p>
    </form>
</body>
</html>
