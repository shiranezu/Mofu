{% extends 'auth/base_auth.html' %}

{% block title %}Login - Sachi{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        <input placeholder="Username" name="username"><br><br>
        <input placeholder="Password" type="password" name="password"><br><br>
        <button>Login</button>
        <p>Not registered? <a href="{% url 'planner:register' %}">Create an account</a></p>
    </form>
{% endblock %}
