{% extends 'auth/base_auth.html' %}

{% block title %}Register - Sachi{% endblock %}

{% block content %}
    <h2>Create an Account</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <br>
        <button>Submit</button>
        <p>Already registered? <a href="{% url 'planner:login' %}">Login</a></p>
    </form>
{% endblock %}
