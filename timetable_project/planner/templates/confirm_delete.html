{% extends 'base.html' %}

{% block title %}Confirm Delete - Sachi{% endblock %}

{% block content %}
    <h2>Are you sure you want to delete "{{ object.name }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="javascript:history.back()">Cancel</a>
    </form>
{% endblock %}
